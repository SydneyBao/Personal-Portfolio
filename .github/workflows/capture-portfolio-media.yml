name: Capture portfolio media

on:
  workflow_dispatch:
    inputs:
      requestId:
        description: Correlation ID generated by the authenticated media service
        required: true
        type: string
      slug:
        description: Validated project slug
        required: true
        type: string
      url:
        description: Public HTTPS project URL
        required: true
        type: string

permissions: {}

jobs:
  capture:
    name: Capture without write credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out capture code without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Install isolated Playwright runtime
        shell: bash
        run: |
          set -euo pipefail
          runtime_directory="$RUNNER_TEMP/portfolio-playwright"
          mkdir -p "$runtime_directory"
          npm install \
            --prefix "$runtime_directory" \
            --no-save \
            --package-lock=false \
            --ignore-scripts \
            --no-audit \
            --no-fund \
            playwright@1.55.0
          "$runtime_directory/node_modules/.bin/playwright" install --with-deps chromium

      - name: Capture through the public-only pinned proxy
        env:
          CAPTURE_ARTIFACT_DIR: ${{ runner.temp }}/portfolio-capture-output
          CAPTURE_REQUEST_ID: ${{ inputs.requestId }}
          CAPTURE_SLUG: ${{ inputs.slug }}
          CAPTURE_URL: ${{ inputs.url }}
          PLAYWRIGHT_RUNTIME_DIR: ${{ runner.temp }}/portfolio-playwright
        run: node .github/workflows/scripts/capture-portfolio-media.mjs capture

      - name: Upload validated capture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: portfolio-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portfolio-capture-output
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 1
          compression-level: 0

  commit:
    name: Validate and commit without target access
    needs: capture
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: write
    steps:
      - name: Check out the destination branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.ref_name }}

      - name: Download capture artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: portfolio-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/portfolio-capture-download

      - name: Revalidate and stage fixed media paths
        env:
          CAPTURE_ARTIFACT_DIR: ${{ runner.temp }}/portfolio-capture-download
          CAPTURE_REQUEST_ID: ${{ inputs.requestId }}
          CAPTURE_SLUG: ${{ inputs.slug }}
        run: node .github/workflows/scripts/capture-portfolio-media.mjs stage

      - name: Commit and push captured media
        env:
          CAPTURE_REQUEST_ID: ${{ inputs.requestId }}
          CAPTURE_SLUG: ${{ inputs.slug }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SydneyBao"
          git config user.email "156055948+SydneyBao@users.noreply.github.com"
          git add -- \
            "public/portfolio/uploads/$CAPTURE_SLUG/captures/$CAPTURE_REQUEST_ID/cover.webp" \
            "public/portfolio/uploads/$CAPTURE_SLUG/captures/$CAPTURE_REQUEST_ID/walkthrough.webm"

          if git diff --cached --quiet; then
            echo "Capture output is unchanged; no commit is needed."
            exit 0
          fi

          git commit -m "Capture portfolio media for $CAPTURE_SLUG"
          push_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push "$push_url" "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          echo "Could not push captured media after three attempts." >&2
          exit 1
